[project]
name = "atlas"
version = "0.1.0"
description = "ATLAS — Autonomous Task & Learning Agent System (local-first personal agent)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "chromadb>=0.5",
    "cryptography>=49.0.0",
    "feedparser>=6.0.12",
    "email-validator>=2.3.0",
    "playwright>=1.61.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.32",
    "websockets>=16.0",
    "prompt-toolkit>=3.0.53",
]

[project.optional-dependencies]
macos = [
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
atlas = "atlas_cli.main:app"

# uv dev dependencies (uv reads this group natively)
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas", "src/atlas_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["atlas"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 63
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF006"]  # asyncio.create_task reference storage is idiomatic in long-lived services

[tool.ruff.lint.per-file-ignores]
"src/atlas/interfaces/api/*" = ["B008"]        # FastAPI Depends() in defaults is idiomatic
"src/atlas/interfaces/api/idempotency.py" = ["N818"]  # IdempotencyConflict naming is intentional
"src/atlas/safety/sandbox_native.py" = ["ASYNC240"]  # pathlib in async is acceptable here
"src/atlas/capabilities/browser/*" = ["ASYNC220"]   # subprocess in browser engine is intentional
"tests/*" = ["ASYNC230", "ASYNC240", "E402"]   # tests use blocking open/path ops on tmp dirs
"src/atlas/interfaces/api/routes_attachments.py" = ["ASYNC230"]  # small local file upload, blocking open acceptable
"src/atlas/interfaces/api/routes_knowledge.py" = ["ASYNC240"]   # pathlib on small index files
"src/atlas/memory/knowledge_store.py" = ["ASYNC230", "ASYNC240"]  # local index files, sub-ms operations
"src/atlas/interfaces/cli.py" = ["RUF001", "ASYNC240"]  # EN DASH help text; async helpers touch local paths
"src/atlas/memory/episodic.py" = ["ASYNC240"]   # event-store path check, sub-ms
"src/atlas/interfaces/api/routes_providers.py" = ["ASYNC240", "RUF002"]  # small local config read; × in docstring is intentional
"src/atlas/knowledge/document_processor.py" = ["ASYNC240"]  # local file ingestion, sub-ms path ops
"src/atlas_cli/main.py" = ["ASYNC240"]  # CLI reads local config.yaml, sub-ms path ops

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["atlas"]
mypy_path = "src"
