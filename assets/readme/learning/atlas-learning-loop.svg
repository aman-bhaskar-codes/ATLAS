<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="The experimental self-improvement loop: a completed task produces a full trajectory of actions, observations and decisions; a post-task experience extractor distils lessons into skills and strategies that can inform future planning. This loop is experimental and never bypasses the Safety Engine.">
  <defs>
    <filter id="l-glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="l-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker>
  </defs>
  <rect width="960" height="470" fill="#0d1117"/>
  <rect x="10" y="10" width="940" height="450" rx="16" fill="none" stroke="#d29922" stroke-width="1.2" stroke-dasharray="7 6" opacity="0.55"/>
  <text x="44" y="52" fill="#e6edf3" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" font-weight="600">Self-improvement loop</text>
  <g>
    <rect x="806" y="34" width="120" height="24" rx="12" fill="#3d2f14" stroke="#d29922"/>
    <text x="866" y="50" text-anchor="middle" fill="#f2cc60" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="700" letter-spacing="1">EXPERIMENTAL</text>
  </g>
  <text x="44" y="74" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">post-task experience extraction feeds planning — it never bypasses the Safety Engine</text>

  <!-- cycle edges -->
  <g fill="none" stroke="#d29922" stroke-width="2" opacity="0.6">
    <path d="M232 168 C 300 130, 360 120, 402 135" marker-end="url(#l-arrow)"/>
    <path d="M556 135 C 640 118, 700 130, 742 168" marker-end="url(#l-arrow)"/>
    <path d="M772 214 C 800 280, 760 330, 712 356" marker-end="url(#l-arrow)"/>
    <path d="M566 388 H 396" marker-end="url(#l-arrow)"/>
    <path d="M250 356 C 190 320, 175 250, 190 206" marker-end="url(#l-arrow)"/>
  </g>

  <!-- travelling pulses -->
  <g>
    <circle r="3.4" fill="#f2cc60" filter="url(#l-glow)"><animateMotion path="M232,168 C 300,130 360,120 402,135" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#f2cc60" filter="url(#l-glow)"><animateMotion path="M556,135 C 640,118 700,130 742,168" dur="2s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#f2cc60" filter="url(#l-glow)"><animateMotion path="M772,214 C 800,280 760,330 712,356" dur="2s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#f2cc60" filter="url(#l-glow)"><animateMotion path="M566,388 H396" dur="2s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#f2cc60" filter="url(#l-glow)"><animateMotion path="M250,356 C 190,320 175,250 190,206" dur="2s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- centre label -->
  <text x="480" y="248" text-anchor="middle" fill="#484f58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="3">EXPERIENCE → SKILL</text>
  <text x="480" y="266" text-anchor="middle" fill="#484f58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="3">LEARNING</text>

  <!-- nodes -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g><rect x="118" y="145" width="118" height="58" rx="10" fill="#161b22" stroke="#8b949e"/><text x="177" y="170" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">TASK</text><text x="177" y="187" text-anchor="middle" fill="#8b949e" font-size="8.5">completed run</text></g>
    <g><rect x="402" y="106" width="154" height="58" rx="10" fill="#161b22" stroke="#58a6ff"/><text x="479" y="131" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">TRAJECTORY</text><text x="479" y="148" text-anchor="middle" fill="#8b949e" font-size="8">actions·obs·decisions</text></g>
    <g><rect x="742" y="145" width="160" height="58" rx="10" fill="#161b22" stroke="#bc8cff"/><text x="822" y="170" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="700">EXPERIENCE</text><text x="822" y="187" text-anchor="middle" fill="#8b949e" font-size="8.5">extractor</text></g>
    <g><rect x="632" y="359" width="160" height="58" rx="10" fill="#161b22" stroke="#3fb950"/><text x="712" y="384" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">SKILLS</text><text x="712" y="401" text-anchor="middle" fill="#8b949e" font-size="8.5">&amp; strategies</text></g>
    <g><rect x="238" y="359" width="158" height="58" rx="10" fill="#161b22" stroke="#d29922"/><text x="317" y="384" text-anchor="middle" fill="#d29922" font-size="12" font-weight="700">PLANNING</text><text x="317" y="401" text-anchor="middle" fill="#8b949e" font-size="8.5">informs next plan</text></g>
  </g>
</svg>
