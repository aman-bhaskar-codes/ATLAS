<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" width="1160" height="440" role="img" aria-label="The knowledge fabric pipeline: sources (documents, web, codebase) feed two parallel retrieval lanes — BM25 lexical search and vector similarity — which merge via reciprocal-rank fusion, then feature reranking, then a prompt-injection scan, producing grounded, cited context for the model.">
  <defs>
    <filter id="k-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="k-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#484f58"/></marker>
    <linearGradient id="k-edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#30363d"/><stop offset="100%" stop-color="#484f58"/></linearGradient>
  </defs>
  <rect width="1160" height="440" fill="#0d1117"/>
  <text x="44" y="48" fill="#e6edf3" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" font-weight="600">Knowledge fabric</text>
  <text x="44" y="70" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">hybrid retrieval, fused &amp; reranked, injection-scanned before it can influence the model · retrieval is time-bounded and degrades gracefully</text>

  <!-- edges -->
  <g fill="none" stroke="url(#k-edge)" stroke-width="1.8">
    <path d="M162 210 C 210 180, 240 160, 300 155" marker-end="url(#k-arrow)"/>
    <path d="M162 246 C 210 300, 240 320, 300 325" marker-end="url(#k-arrow)"/>
    <path d="M430 155 C 470 180, 470 205, 500 228" marker-end="url(#k-arrow)"/>
    <path d="M430 325 C 470 300, 470 275, 500 252" marker-end="url(#k-arrow)"/>
    <path d="M630 240 H 690" marker-end="url(#k-arrow)"/>
    <path d="M810 240 H 870" marker-end="url(#k-arrow)"/>
    <path d="M990 240 H 1050" marker-end="url(#k-arrow)"/>
  </g>

  <!-- flowing pulses -->
  <g>
    <circle r="3.2" fill="#bc8cff" filter="url(#k-glow)"><animateMotion path="M162,210 C 210,180 240,160 300,155" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#39c5cf" filter="url(#k-glow)"><animateMotion path="M162,246 C 210,300 240,320 300,325" dur="1.6s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#bc8cff" filter="url(#k-glow)"><animateMotion path="M430,155 C 470,180 470,205 500,228" dur="1.4s" begin="0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#39c5cf" filter="url(#k-glow)"><animateMotion path="M430,325 C 470,300 470,275 500,252" dur="1.4s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#58a6ff" filter="url(#k-glow)"><animateMotion path="M630,240 H690" dur="1s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#58a6ff" filter="url(#k-glow)"><animateMotion path="M810,240 H870" dur="1s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#3fb950" filter="url(#k-glow)"><animateMotion path="M990,240 H1050" dur="1s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1s" begin="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <!-- Sources -->
    <rect x="34" y="196" width="128" height="64" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="98" y="222" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="700">SOURCES</text>
    <text x="98" y="240" text-anchor="middle" fill="#8b949e" font-size="8.5">docs · web · codebase</text>

    <!-- BM25 lane -->
    <rect x="300" y="123" width="130" height="64" rx="10" fill="#161b22" stroke="#bc8cff" stroke-opacity="0.7"/>
    <text x="365" y="149" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="700">BM25</text>
    <text x="365" y="167" text-anchor="middle" fill="#8b949e" font-size="8.5">lexical search</text>

    <!-- Vector lane -->
    <rect x="300" y="293" width="130" height="64" rx="10" fill="#161b22" stroke="#39c5cf" stroke-opacity="0.7"/>
    <text x="365" y="319" text-anchor="middle" fill="#39c5cf" font-size="12" font-weight="700">VECTOR</text>
    <text x="365" y="337" text-anchor="middle" fill="#8b949e" font-size="8.5">similarity</text>

    <!-- Fusion -->
    <rect x="500" y="208" width="130" height="64" rx="10" fill="#161b22" stroke="#58a6ff"/>
    <text x="565" y="234" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">RRF FUSION</text>
    <text x="565" y="252" text-anchor="middle" fill="#8b949e" font-size="8.5">reciprocal rank</text>

    <!-- Rerank -->
    <rect x="690" y="208" width="120" height="64" rx="10" fill="#161b22" stroke="#58a6ff"/>
    <text x="750" y="234" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">RERANK</text>
    <text x="750" y="252" text-anchor="middle" fill="#8b949e" font-size="8">authority·fresh·rel</text>

    <!-- Injection scan -->
    <rect x="870" y="208" width="120" height="64" rx="10" fill="#132a1a" stroke="#3fb950"/>
    <text x="930" y="230" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">INJECTION</text>
    <text x="930" y="245" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">SCAN</text>
    <text x="930" y="260" text-anchor="middle" fill="#8b949e" font-size="8">prompt-injection guard</text>

    <!-- Grounded context -->
    <rect x="1050" y="204" width="96" height="72" rx="10" fill="#0d1117" stroke="#a6d3ff"/>
    <text x="1098" y="230" text-anchor="middle" fill="#a6d3ff" font-size="11" font-weight="700">GROUNDED</text>
    <text x="1098" y="245" text-anchor="middle" fill="#a6d3ff" font-size="11" font-weight="700">CONTEXT</text>
    <text x="1098" y="262" text-anchor="middle" fill="#8b949e" font-size="8">cited · ranked</text>
  </g>
</svg>
