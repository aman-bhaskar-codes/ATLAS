<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="ATLAS — Autonomous Task and Learning Agent System. A local-first, safety-governed agent runtime: zero cost by default, five free OpenRouter models, five-tier safety gate, hash-chained audit.">
  <defs>
    <radialGradient id="bg" cx="28%" cy="38%" r="95%">
      <stop offset="0%" stop-color="#111823"/><stop offset="55%" stop-color="#0d1117"/><stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff"/><stop offset="38%" stop-color="#bc8cff"/>
      <stop offset="72%"  stop-color="#f778ba"/><stop offset="100%" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#cfe8ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dbeaff"/><stop offset="45%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#1f6feb" stop-opacity="0.25"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#30363d" stroke-width="1" stroke-opacity="0.42"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="44 0" dur="11s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="reveal"><rect x="72" y="86" width="0" height="130"><animate attributeName="width" from="0" to="400" dur="1.5s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="0;400"/></rect></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="400" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- orbital capability constellation -->
    <g transform="translate(965 196)">
      <g fill="none" stroke="#30363d" stroke-opacity="0.85">
        <ellipse rx="132" ry="132" stroke-dasharray="3 7"/>
        <ellipse rx="96"  ry="96"  stroke-dasharray="2 6" stroke-opacity="0.6"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
        <g stroke="#1f6feb" stroke-opacity="0.35" stroke-width="1">
          <line x1="0" y1="0" x2="132" y2="0"/><line x1="0" y1="0" x2="40.8" y2="125.5"/>
          <line x1="0" y1="0" x2="-106.8" y2="77.6"/><line x1="0" y1="0" x2="-106.8" y2="-77.6"/>
          <line x1="0" y1="0" x2="40.8" y2="-125.5"/>
        </g>
        <g>
          <circle cx="132" cy="0" r="7" fill="#58a6ff"><animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/></circle>
          <circle cx="40.8" cy="125.5" r="7" fill="#bc8cff"><animate attributeName="r" values="7;10;7" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
          <circle cx="-106.8" cy="77.6" r="7" fill="#f778ba"><animate attributeName="r" values="7;10;7" dur="2.6s" begin="1.0s" repeatCount="indefinite"/></circle>
          <circle cx="-106.8" cy="-77.6" r="7" fill="#3fb950"><animate attributeName="r" values="7;10;7" dur="2.6s" begin="1.5s" repeatCount="indefinite"/></circle>
          <circle cx="40.8" cy="-125.5" r="7" fill="#f0883e"><animate attributeName="r" values="7;10;7" dur="2.6s" begin="2.0s" repeatCount="indefinite"/></circle>
        </g>
      </g>
      <g transform="rotate(0)">
        <circle r="46" fill="url(#coreG)" filter="url(#soft)" opacity="0.9">
          <animate attributeName="r" values="44;50;44" dur="4.2s" repeatCount="indefinite"/>
        </circle>
        <path d="M0 -26 22.5 -13 22.5 13 0 26 -22.5 13 -22.5 -13Z" fill="none" stroke="#dbeaff" stroke-width="1.8" stroke-opacity="0.95">
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        </path>
        <text y="5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#dbeaff" letter-spacing="1.5">OTAR</text>
      </g>
    </g>

    <!-- title block, typed in behind a clip -->
    <g clip-path="url(#reveal)">
      <text x="76" y="178" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="104" font-weight="700"
            letter-spacing="6" fill="url(#title)" filter="url(#glow)">ATLAS</text>
    </g>
    <rect x="72" y="92" width="3" height="118" fill="#58a6ff" opacity="0">
      <animate attributeName="x" from="72" to="446" dur="1.5s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1" values="72;446"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="1.8s" begin="0.25s" fill="freeze"/>
    </rect>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.5s" fill="freeze"/>
      <text x="78" y="216" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#e6edf3">
        Autonomous Task &amp; Learning Agent System
      </text>
      <text x="78" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15.5" fill="#8b949e">
        A local-first, safety-governed agent runtime — zero-cost by default.
      </text>
    </g>

    <!-- status chips -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.95s" fill="freeze"/>
        <rect x="78" y="290" width="132" height="30" rx="15" fill="#0f2417" stroke="#238636"/>
        <circle cx="98" cy="305" r="4" fill="#3fb950"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
        <text x="110" y="310" fill="#3fb950">$0 by default</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.1s" fill="freeze"/>
        <rect x="220" y="290" width="168" height="30" rx="15" fill="#101c2e" stroke="#1f6feb"/>
        <text x="238" y="310" fill="#58a6ff">5 free models · 1 key</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.25s" fill="freeze"/>
        <rect x="398" y="290" width="150" height="30" rx="15" fill="#1c1233" stroke="#8957e5"/>
        <text x="416" y="310" fill="#bc8cff">T0–T4 safety gate</text></g>
      <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
        <rect x="558" y="290" width="176" height="30" rx="15" fill="#2b1224" stroke="#bf4b8a"/>
        <text x="576" y="310" fill="#f778ba">SHA-256 audit chain</text></g>
    </g>

    <!-- cinematic light sweep + letterbox + vignette -->
    <g opacity="0.9"><rect x="-360" y="-40" width="230" height="480" fill="url(#sweep)" transform="skewX(-18)">
      <animate attributeName="x" from="-360" to="1320" dur="7s" begin="1.2s" repeatCount="indefinite"/></rect></g>
    <rect width="1200" height="400" fill="url(#vig)"/>
    <rect y="0" width="1200" height="18" fill="#08090d"/><rect y="382" width="1200" height="18" fill="#08090d"/>
    <rect x="0.5" y="0.5" width="1199" height="399" rx="14" fill="none" stroke="#30363d"/>
  </g>
</svg>
