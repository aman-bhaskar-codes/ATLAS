<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="The ATLAS request pipeline: every request from the CLI, HTTP API, WebSocket or voice transport enters one orchestrator, is classified into a T0 to T4 safety tier, gated by the deny-by-default SafetyEngine, executed in a sandboxed tool call, appended to a hash-chained audit log, and returned with full provenance.">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1521"/><stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/><stop offset="50%" stop-color="#8957e5"/><stop offset="100%" stop-color="#bf4b8a"/>
    </linearGradient>
    <radialGradient id="pkt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pframe"><rect width="1200" height="300" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#pframe)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="1200" height="300" fill="url(#pbg)"/>
    <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#30363d"/>

    <text x="24" y="34" font-size="13" fill="#8b949e" letter-spacing="2.5">ONE FUNNEL — NO TRANSPORT BYPASSES IT</text>

    <!-- the wire every request rides -->
    <line x1="170" y1="140" x2="1030" y2="140" stroke="url(#wire)" stroke-width="2" stroke-opacity="0.45"/>
    <line x1="170" y1="140" x2="1030" y2="140" stroke="#58a6ff" stroke-width="2" stroke-dasharray="10 14" stroke-opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>

    <!-- stage cards -->
    <g stroke-width="1.4">
      <g><rect x="10" y="96" width="160" height="88" rx="10" fill="#101c2e" stroke="#1f6feb"/>
        <text x="90" y="124" text-anchor="middle" font-size="13" fill="#58a6ff" font-weight="700">INGRESS</text>
        <text x="90" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">cli · api · ws</text>
        <text x="90" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">voice · cron</text></g>

      <g><rect x="214" y="96" width="160" height="88" rx="10" fill="#141b2d" stroke="#388bfd"/>
        <text x="294" y="124" text-anchor="middle" font-size="13" fill="#79c0ff" font-weight="700">ORCHESTRATOR</text>
        <text x="294" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">observe · think</text>
        <text x="294" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">act · reflect</text></g>

      <g><rect x="418" y="96" width="160" height="88" rx="10" fill="#1c1233" stroke="#8957e5"/>
        <text x="498" y="124" text-anchor="middle" font-size="13" fill="#bc8cff" font-weight="700">CLASSIFY</text>
        <text x="498" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">T0 → T4 tier</text>
        <text x="498" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">+ provenance</text></g>

      <g><rect x="622" y="96" width="160" height="88" rx="10" fill="#2b1224" stroke="#bf4b8a"/>
        <text x="702" y="124" text-anchor="middle" font-size="13" fill="#f778ba" font-weight="700">SAFETY GATE</text>
        <text x="702" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">deny by default</text>
        <text x="702" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">approve · kill</text></g>

      <g><rect x="826" y="96" width="160" height="88" rx="10" fill="#0f2417" stroke="#238636"/>
        <text x="906" y="124" text-anchor="middle" font-size="13" fill="#3fb950" font-weight="700">EXECUTE</text>
        <text x="906" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">sandboxed tool</text>
        <text x="906" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">1 cpu · 512 mb</text></g>

      <g><rect x="1030" y="96" width="160" height="88" rx="10" fill="#241a08" stroke="#9e6a03"/>
        <text x="1110" y="124" text-anchor="middle" font-size="13" fill="#e3b341" font-weight="700">AUDIT</text>
        <text x="1110" y="145" text-anchor="middle" font-size="10.5" fill="#8b949e">sha-256 chain</text>
        <text x="1110" y="162" text-anchor="middle" font-size="10.5" fill="#8b949e">append only</text></g>
    </g>

    <!-- the request itself, travelling the funnel -->
    <g filter="url(#pglow)">
      <circle r="13" fill="url(#pkt)">
        <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0.18;0.2;0.38;0.4;0.58;0.62;0.8;0.84;1"
                       keyTimes="0;0.14;0.2;0.34;0.4;0.56;0.64;0.8;0.88;1" calcMode="linear"
                       path="M90,140 H294 H498 H702 H906 H1110"/>
      </circle>
      <circle r="4.5" fill="#ffffff">
        <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;0.18;0.2;0.38;0.4;0.58;0.62;0.8;0.84;1"
                       keyTimes="0;0.14;0.2;0.34;0.4;0.56;0.64;0.8;0.88;1" calcMode="linear"
                       path="M90,140 H294 H498 H702 H906 H1110"/>
      </circle>
    </g>

    <!-- gate verdict lamps -->
    <g>
      <circle cx="702" cy="206" r="5" fill="#3fb950" opacity="0.25">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="7s" begin="4.1s" repeatCount="indefinite"/></circle>
      <text x="714" y="210" font-size="10.5" fill="#3fb950" opacity="0.8">allow</text>
      <circle cx="640" cy="206" r="5" fill="#f85149" opacity="0.25"/>
      <text x="600" y="210" font-size="10.5" fill="#f85149" opacity="0.6" text-anchor="end">deny · escalate</text>
    </g>

    <!-- audit chain links forming -->
    <g transform="translate(1030 220)">
      <g fill="none" stroke="#9e6a03" stroke-width="1.2">
        <rect x="0" y="0" width="26" height="18" rx="3"/><rect x="36" y="0" width="26" height="18" rx="3"/>
        <rect x="72" y="0" width="26" height="18" rx="3"/><rect x="108" y="0" width="26" height="18" rx="3"/>
      </g>
      <g stroke="#e3b341" stroke-width="1.2"><line x1="26" y1="9" x2="36" y2="9"/><line x1="62" y1="9" x2="72" y2="9"/><line x1="98" y1="9" x2="108" y2="9"/></g>
      <rect x="108" y="0" width="26" height="18" rx="3" fill="#e3b341" fill-opacity="0.18" stroke="#e3b341">
        <animate attributeName="fill-opacity" values="0.18;0.65;0.18" dur="7s" begin="6.2s" repeatCount="indefinite"/></rect>
    </g>

    <text x="24" y="272" font-size="11" fill="#6e7681">every stage above is a real call site — orchestration/orchestrator.py → safety/classifier.py → safety/engine.py → orchestration/registry.py → safety/audit.py</text>
  </g>
</svg>
