<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- AUTO card -->
  <g>
    <rect x="10" y="20" width="140" height="240" rx="12" fill="url(#cardGrad)" stroke="#3fb950" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="80" cy="60" r="18" fill="none" stroke="#3fb950" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="65" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="14">T0</text>
    <text x="80" y="100" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="12" font-weight="bold">AUTO</text>
    <text x="80" y="120" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="9">Zero Risk</text>
    <line x1="40" y1="135" x2="120" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="80" y="155" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Auto-approve</text>
    <text x="80" y="170" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Log silently</text>
    <line x1="40" y1="185" x2="120" y2="185" stroke="#21262d" stroke-width="1"/>
    <text x="80" y="205" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Read files</text>
    <text x="80" y="220" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Search memory</text>
    <text x="80" y="235" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Query knowledge</text>
  </g>

  <!-- NOTIFY card -->
  <g>
    <rect x="170" y="20" width="140" height="240" rx="12" fill="url(#cardGrad)" stroke="#58a6ff" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="240" cy="60" r="18" fill="none" stroke="#58a6ff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="240" y="65" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="14">T1</text>
    <text x="240" y="100" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">NOTIFY</text>
    <text x="240" y="120" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="9">Low Risk</text>
    <line x1="200" y1="135" x2="280" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="240" y="155" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Auto-approve</text>
    <text x="240" y="170" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Notify user</text>
    <line x1="200" y1="185" x2="280" y2="185" stroke="#21262d" stroke-width="1"/>
    <text x="240" y="205" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Browse web</text>
    <text x="240" y="220" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Write to /tmp</text>
    <text x="240" y="235" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Fetch URLs</text>
  </g>

  <!-- CONFIRM card -->
  <g>
    <rect x="330" y="20" width="140" height="240" rx="12" fill="url(#cardGrad)" stroke="#d29922" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="400" cy="60" r="18" fill="none" stroke="#d29922" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="65" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="14">T2</text>
    <text x="400" y="100" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="12" font-weight="bold">CONFIRM</text>
    <text x="400" y="120" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="9">Medium Risk</text>
    <line x1="360" y1="135" x2="440" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="400" y="155" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Pause execution</text>
    <text x="400" y="170" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Require approval</text>
    <line x1="360" y1="185" x2="440" y2="185" stroke="#21262d" stroke-width="1"/>
    <text x="400" y="205" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Send emails</text>
    <text x="400" y="220" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Delete files</text>
    <text x="400" y="235" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Shell commands</text>
  </g>

  <!-- DANGEROUS card -->
  <g>
    <rect x="490" y="20" width="140" height="240" rx="12" fill="url(#cardGrad)" stroke="#f0883e" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="560" cy="60" r="18" fill="none" stroke="#f0883e" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="560" y="65" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="14">T3</text>
    <text x="560" y="100" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="11" font-weight="bold">DANGEROUS</text>
    <text x="560" y="120" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="9">High Risk</text>
    <line x1="520" y1="135" x2="600" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="560" y="155" text-anchor="middle" fill="#c9d1d9" font-family="sans-serif" font-size="8">Approval +</text>
    <text x="560" y="170" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="8" font-weight="bold">4-DIGIT CODE</text>
    <line x1="520" y1="185" x2="600" y2="185" stroke="#21262d" stroke-width="1"/>
    <text x="560" y="205" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Drop database</text>
    <text x="560" y="220" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Modify configs</text>
    <text x="560" y="235" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Spend money</text>
  </g>

  <!-- BLOCK card -->
  <g>
    <rect x="650" y="20" width="140" height="240" rx="12" fill="url(#cardGrad)" stroke="#f85149" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="720" cy="60" r="18" fill="none" stroke="#f85149" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="2s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="720" y="65" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="14">T4</text>
    <text x="720" y="100" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="12" font-weight="bold">BLOCK</text>
    <text x="720" y="120" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="9">Critical Risk</text>
    <line x1="680" y1="135" x2="760" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="720" y="155" text-anchor="middle" fill="#f85149" font-family="sans-serif" font-size="8" font-weight="bold">NEVER</text>
    <text x="720" y="170" text-anchor="middle" fill="#f85149" font-family="sans-serif" font-size="8" font-weight="bold">EXECUTED</text>
    <line x1="680" y1="185" x2="760" y2="185" stroke="#21262d" stroke-width="1"/>
    <text x="720" y="205" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Access creds</text>
    <text x="720" y="220" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">Financial txns</text>
    <text x="720" y="235" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="7">System root</text>
    <!-- X overlay -->
    <line x1="670" y1="195" x2="770" y2="245" stroke="#f85149" stroke-width="1" opacity="0.3"/>
    <line x1="770" y1="195" x2="670" y2="245" stroke="#f85149" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Escalation arrows between cards -->
  <text x="155" y="15" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="8">▶</text>
  <text x="315" y="15" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="8">▶</text>
  <text x="475" y="15" text-anchor="middle" fill="#d29922" font-family="monospace" font-size="8">▶</text>
  <text x="635" y="15" text-anchor="middle" fill="#f0883e" font-family="monospace" font-size="8">▶</text>
</svg>
