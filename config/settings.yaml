logging:
  level: INFO
  format: console        # console | json

# ── Operating Profile ──────────────────────────────────────────────────
# Profiles: local_free | free_hybrid | free_demo | production
# ATLAS_PROFILE env var overrides this.
# free_hybrid: cloud allowed, cost_class {local, free, free_quota} — the
# correct profile for the five OpenRouter free_quota models (no Ollama floor).
profile: free_hybrid

# ── Cost & Network Policy ─────────────────────────────────────────────
# These can be overridden by the profile or set independently.
# ATLAS_COST_POLICY and ATLAS_NETWORK_POLICY env vars override these.
cost_policy: free_only       # zero_cost | free_only | free_preferred | balanced | unrestricted
network_policy: free_cloud   # offline | local_only | free_cloud | unrestricted

models:
  gpu_concurrency: 1
  local_timeout_s: 120
  cloud_timeout_s: 90
  allow_cloud: true        # the five free models are cloud (OpenRouter)
  # Startup discovery of ALL free OpenRouter models is OFF: only the five
  # curated ids in models.yaml exist. Flip to true to opt into auto-sync.
  sync_openrouter_free: false
  daily_usd: 0.00
  weekly_usd: 0.00
  monthly_usd: 0.00
  per_task_usd: 0.00
  # ── Phase 4 inference tiers ──────────────────────────────────────────
  # Logical model ids (must exist in models.yaml), in preference order.
  # These are RANKING preferences applied AFTER the selector's hard cost/
  # network/privacy filters — listing a paid model cannot bypass a zero-cost
  # profile, it simply has no eligible candidate. Change these to retune
  # tiers without touching code.
  # FAST: cheap, low-latency work that runs on every task (intent extraction,
  #       routing, short summaries). Coders + multimodal general agent lead.
  fast_models:
    - north-mini-code-free           # fast agentic coder / tool work
    - minimax-m3-free                # general, long-context
    - laguna-s-2.1-free              # coding fallback
  # DEEP: quality reasoning worth a slower/stronger model (planning, recovery,
  #       verification). GLM + Nemotron lead; MiniMax as the long-context floor.
  deep_models:
    - glm-5.2-free
    - nemotron-3-ultra-free
    - minimax-m3-free
  # Last-resort chain when a tier's picks are all unavailable.
  fallback_models:
    - minimax-m3-free
    - glm-5.2-free
safety:
  stop_flag_path: STOP.flag
  confirm_timeout_s: 300
  default_tier_on_error: 2
notify:
  confirm_timeout_s: 300
  quiet_hours: null      # Phase 6
metrics:
  snapshot_interval_s: 60
tracing:
  enabled: true
sandbox:
  image: "python:3.13-slim"
  cpus: 1.0
  memory: "512m"
  pids_limit: 128
  workdir: "/work"

critique:
  enabled: true          # master switch
  min_tier: 2            # only critique actions at/above this tier (Tier.CONFIRM)
  revise_max: 1          # bounded regeneration (no ping-pong)

# ── Phase 12 verification ─────────────────────────────────────────────
# Post-hoc checking of DELIVERED work against the intent's success criteria.
# Separate from `critique` (which reviews a PROPOSED action before dispatch):
# disabling critique must NOT disable verification.
verification:
  enabled: true
  max_replans: 3         # bounded recovery loop (Phase 11)
  min_pass_score: 0.5    # a "passed" verdict below this is treated as a fail
  # Read-only check for CODING tasks. Runs THROUGH the SafetyEngine like any
  # other action; empty = disabled. The command is fixed here, never model-
  # supplied (a model-chosen command would be arbitrary code execution).
  command: ""            # e.g. "uv run pytest -q" or "uv run ruff check"
  command_timeout_s: 120

# Multi-agent specialist layer. A supervisor splits a MODERATE/COMPLEX request
# into a dependency graph of subtasks, runs independent ones concurrently on the
# SAME reasoning loop (so every tool call still passes SafetyEngine.guard), then
# synthesizes one answer. It declines and falls back to serial execution for
# anything a single agent can do in a few steps.
#
# Off by default: delegation adds a decomposition call plus a synthesis call on
# top of per-subtask reasoning. Enable it when your workload is multi-branch.
agents:
  enabled: false
  max_subtasks: 4          # hard ceiling on graph size
  min_subtasks: 2          # below this, serial execution is cheaper
  max_steps_per_subtask: 6
  max_concurrency: 2       # concurrent specialists; local models have 1 GPU lane
  max_tokens_per_subtask: 20000
  max_total_tokens: 60000   # whole run; remaining subtasks abandoned past this
  subtask_runtime_s: 180.0 # per specialist
  deadline_s: 600.0        # whole delegated run; remaining subtasks are skipped
  synthesis_max_tokens: 2048

# Voice pipeline (speech-in / speech-out). Pure audio<->text engine lives in
# capabilities/voice; the speech->task loop lives in interfaces. Deepgram Flux
# is the low-latency/English primary; Fish Audio S2.1 Pro handles Hindi/
# multilingual/expressive narration; each is the other's TTS fallback.
#
# OFF by default (mirrors browser/agents). PRIVACY: when enabled, microphone
# audio and synthesis text are sent to third parties (Deepgram / Fish Audio) —
# audio leaves the machine. Supply DEEPGRAM_API_KEY / FISH_AUDIO_API_KEY and
# flip enabled=true for live use.
voice:
  enabled: false
  default_language: en                # en -> tts_primary; other languages -> tts_fallback
  tts_primary: openrouter             # openrouter | openrouter_multilingual | deepgram | fish_audio
  tts_fallback: openrouter_multilingual  # non-English + used when the primary errors
  stt_provider: openrouter            # openrouter (whisper) | deepgram (Flux, true partials)
  sample_rate: 16000                  # PCM sample rate for mic capture / STT
  # Speech rides OPENROUTER_API_KEY — no extra vendor key required.
  # Slugs churn; verify on openrouter.ai/models and correct them here.
  openrouter_tts_model: openai/gpt-4o-mini-tts
  openrouter_tts_model_multilingual: fish-audio/s2.1-pro
  openrouter_tts_voice: alloy
  openrouter_tts_voice_multilingual: ""
  openrouter_stt_model: openai/whisper-large-v3

# ── ADE / IDE (Agentic Development Environment) ───────────────────────── #
# Optional, off by default (mirrors voice/browser/agents). Enabling only mounts
# the /api/v1/ide routes — every file mutation still routes through the SAME
# SafetyEngine funnel + filesystem tool as any other dispatch, so the IDE can
# never become a side door around ATLAS policy (Constitution). allowed_roots
# bounds which directories a workspace may open ([] -> any, still funnel-gated).
ide:
  enabled: false
  allowed_roots: []            # workspace roots the ADE may open ([] -> any)
  max_tree_entries: 20000      # ceiling on a single tree() walk
  max_open_file_bytes: 2000000 # refuse to open files larger than this
