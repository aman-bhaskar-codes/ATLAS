version: 1

allowed_paths:
  read:
    - "~/projects/**"
    - "~/atlas/inbox/**"
    - "~/Agentic & AI Agent Projects/**"
    - "~/Agentic*/**"
    - "~/**"   # reads are tier-0; path is a belt-and-suspenders guard, not the primary gate
  write: ["~/projects/scratch/**", "~/atlas/outbox/**", "/tmp/atlas/**"]

allowed_commands:
  read_only:   ["ls", "cat", "grep", "find", "git status", "git log", "git diff"]
  side_effect: ["git add", "git commit", "npm install", "python"]

whatsapp:
  known_contacts: []

safety:
  mass_deletion_threshold: 25
  credential_dirs: ["~/.ssh", "~/.aws", "~/.config/gcloud", "~/.kube", "~/.gnupg", "~/.docker"]
  financial_domains: ["stripe.com", "paypal.com", "coinbase.com", "binance.com", "wise.com", "razorpay.com"]

# Tier reference (Vamos 4-tier model):
#   0 = AUTO       — read-only, no side effects. Auto-approve, log silently.
#   1 = NOTIFY     — reversible side effects. Auto-approve with notification.
#   2 = CONFIRM    — irreversible/external. Require explicit user approval.
#   3 = DANGEROUS  — high-impact (delete DB, spend money, creds). Approval + confirmation code.
#   4 = BLOCK      — hard-blocked, never executed.

rules:
  # ── Filesystem ──
  - {tool: filesystem, operation: read,             tier: 0}
  - {tool: filesystem, operation: search,           tier: 0}
  - {tool: filesystem, operation: list,             tier: 0}  # model-generated
  - {tool: filesystem, operation: list_directory,   tier: 0}  # model-generated
  - {tool: filesystem, operation: inspect,          tier: 0}  # model-generated
  - {tool: filesystem, operation: stat,             tier: 0}  # model-generated
  - {tool: filesystem, operation: tree,             tier: 0}  # model-generated
  - {tool: filesystem, operation: "read_*",         tier: 0}  # any read_X variant
  - {tool: filesystem, operation: write,            tier: 1, constraint: within_write_paths}
  - {tool: filesystem, operation: delete,           tier: 2}
  - {tool: filesystem, operation: overwrite,        tier: 2}
  # ── Knowledge / Memory ──
  - {tool: knowledge,  operation: search,    tier: 0}
  - {tool: memory,     operation: search,    tier: 0}
  - {tool: memory,     operation: store,     tier: 0}
  # ── Shell ──
  - {tool: shell, operation: read_only,   tier: 1, constraint: cmd_in_read_only}
  - {tool: shell, operation: "read*",     tier: 1, constraint: cmd_in_read_only}
  - {tool: shell, operation: side_effect, tier: 2, constraint: cmd_in_side_effect}
  # ── Code Execution (sandboxed) ──
  - {tool: code,       operation: execute,   tier: 1}
  # ── HTTP Requests ──
  - {tool: http,       operation: get,       tier: 1}
  - {tool: http,       operation: post,      tier: 2}
  - {tool: http,       operation: put,       tier: 2}
  - {tool: http,       operation: delete,    tier: 3}   # DANGEROUS: external API deletion
  # ── Email ──
  - {tool: email,      operation: read,      tier: 1}
  - {tool: email,      operation: search,    tier: 1}
  - {tool: email,      operation: compose,   tier: 0}
  - {tool: email,      operation: send,      tier: 2, constraint: recipients_known}
  # ── Calendar ──
  - {tool: calendar,   operation: read,      tier: 1}
  - {tool: calendar,   operation: search,    tier: 1}
  - {tool: calendar,   operation: freebusy,  tier: 1}
  - {tool: calendar,   operation: compose,   tier: 0}
  - {tool: calendar,   operation: create,    tier: 2, constraint: attendees_known}
  - {tool: calendar,   operation: update,    tier: 2}
  - {tool: calendar,   operation: delete,    tier: 2}
  # ── Contacts ──
  - {tool: contacts,   operation: read,      tier: 1}
  - {tool: contacts,   operation: search,    tier: 1}
  - {tool: contacts,   operation: create,    tier: 2}
  - {tool: contacts,   operation: update,    tier: 2}
  - {tool: contacts,   operation: merge,     tier: 2}
  - {tool: contacts,   operation: delete,    tier: 2}
  # ── Browser ──
  - {tool: browser,    operation: navigate,  tier: 1}
  - {tool: browser,    operation: extract,   tier: 0}
  - {tool: browser,    operation: screenshot, tier: 1}
  - {tool: browser,    operation: click,     tier: 1}
  - {tool: browser,    operation: type,      tier: 1}
  - {tool: browser,    operation: submit,    tier: 2}
  - {tool: browser,    operation: upload,    tier: 2}
  - {tool: browser,    operation: download,  tier: 2}
  - {tool: browser,    operation: dialog,    tier: 2}
  # ── Computer Use (universal perception/control: browser + macOS + Android) ──
  - {tool: computer_use, operation: perceive, tier: 0}   # read-only perception
  - {tool: computer_use, operation: health,   tier: 0}   # environment introspection
  - {tool: computer_use, operation: act,      tier: 1}   # UI action, evidence-verified
  # ── Notification ──
  - {tool: notify,     operation: send,      tier: 0}
  # ── DANGEROUS tier (3) — high-impact actions needing approval + confirmation code ──
  - {tool: database,   operation: drop,      tier: 3}
  - {tool: database,   operation: truncate,  tier: 3}
  - {tool: system,     operation: config,    tier: 3}
  - {tool: payment,    operation: "*",       tier: 3}

  - {tool: weather, operation: forecast, tier: 0}
  - {tool: location, operation: geocode, tier: 0}
  - {tool: location, operation: country_info, tier: 0}
  - {tool: currency, operation: convert, tier: 0}
hard_block:
  - {tool: "*",        operation: "*",      match: credential_access}
  - {tool: "*",        operation: "*",      match: financial_transaction}
  - {tool: filesystem, operation: delete,   match: mass_deletion}
  - {tool: "*",        operation: "*",      match: edit_safety_config}

# These actions are allowed only after the normal confirmation/preview flow.
# Matchers may raise a lower base rule to the configured tier, never lower it.
require_confirm:
  - {tool: email,      operation: send,     match: sends_to_person, tier: 2}
  - {tool: calendar,   operation: create,   match: invites_person, tier: 2}
  - {tool: calendar,   operation: update,   match: invites_person, tier: 2}
  - {tool: calendar,   operation: delete,   match: destructive_pim, tier: 2}
  - {tool: contacts,   operation: merge,    match: destructive_pim, tier: 2}
  - {tool: contacts,   operation: delete,   match: destructive_pim, tier: 2}
  - {tool: browser,    operation: click,    match: financial_ui, tier: 2}
  - {tool: browser,    operation: click,    match: destructive_ui, tier: 2}
  - {tool: browser,    operation: type,     match: credential_entry, tier: 2}
  - {tool: browser,    operation: submit,   match: submits_form, tier: 2}
  - {tool: computer_use, operation: act,    match: financial_ui, tier: 2}
  - {tool: computer_use, operation: act,    match: credential_entry, tier: 2}
  - {tool: computer_use, operation: act,    match: destructive_ui, tier: 2}

