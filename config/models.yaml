    usd_per_1m_input: 0.30
    usd_per_1m_output: 1.20
    cost_class: paid
    latency_estimate_ms: 900
    capabilities:
      - reasoning
      - planning
      - coding
      - vision
      - tool_calling
      - structured_output
      - long_context
      - classification
      - summarization
      - reflection
      - json_generation
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: true
    supports_tool_calling: true
    quality_score: 0.85
    reliability_score: 0.85
    enabled: true

