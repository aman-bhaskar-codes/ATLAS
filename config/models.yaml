      - json_generation
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: true
    supports_tool_calling: false  # adapter doesn't map tools yet
    quality_score: 0.82
    reliability_score: 0.90
