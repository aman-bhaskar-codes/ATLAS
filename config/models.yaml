# The Intelligence Platform Model Registry
# Every model MUST declare cost_class: local | free | free_quota | paid
# The selector uses cost_class to enforce CostPolicy (zero_cost blocks paid).
#
# ─────────────────────────────────────────────────────────────────────────
# CURATED FLEET: exactly five OpenRouter free-tier chat models. No Ollama,
# no other providers. All $0 within OpenRouter's free-tier limits.
#
# IMPORTANT — provider_model slugs are BEST-GUESS and MUST be confirmed against
# https://openrouter.ai/models before the first live run. They are read from
# YAML, so correcting a slug needs NO code change — edit the value and restart.
# Startup auto-sync of *all* free OpenRouter models is gated OFF
# (models.sync_openrouter_free=false) so ONLY these five ids exist.
# ─────────────────────────────────────────────────────────────────────────

models:
  # ── 1. GLM 5.2 (free) — primary reasoning + agentic (DEEP tier lead) ──
  - id: glm-5.2-free
    provider: openrouter
    provider_model: z-ai/glm-5.2:free
    context_length: 128000
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: free_quota
    latency_estimate_ms: 800
    capabilities:
      - reasoning
      - planning
      - coding
      - tool_calling
      - structured_output
      - classification
      - summarization
      - reflection
      - json_generation
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: false
    supports_tool_calling: true
    quality_score: 0.90
    reliability_score: 0.86
    enabled: true

