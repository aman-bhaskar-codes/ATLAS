# The Intelligence Platform Model Registry
# Every model MUST declare cost_class: local | free | free_quota | paid
# The selector uses cost_class to enforce CostPolicy (zero_cost blocks paid).
#
# ─────────────────────────────────────────────────────────────────────────
# Local Ollama, Gemini, and five free OpenRouter routes plus two paid options.
# Prices, context limits and structured-output support checked against the
# public OpenRouter catalog on 2026-10-06. Availability is not guaranteed.
#
# Free profiles additionally send a provider-side zero-price ceiling, so a
# stale catalog cannot silently route a request to a paid endpoint.
# Startup auto-sync of *all* free OpenRouter models is gated OFF
# (models.sync_openrouter_free=false) to keep this curated catalog.
# ─────────────────────────────────────────────────────────────────────────

models:
  # Primary local coding & reasoning model (Ollama 7B, 32K context)
  - id: local-qwen2.5-coder
    provider: ollama
    provider_model: qwen2.5-coder:7b
    context_length: 32768
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: local
    latency_estimate_ms: 1200
    capabilities: [reasoning, planning, coding, tool_calling, structured_output, classification, summarization, reflection, json_generation, streaming]
    max_concurrency: 1
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_tool_calling: true
    supports_vision: false
    quality_score: 0.82
    reliability_score: 0.88
    enabled: true

  # Primary cloud reasoning & planning model (Gemini 2.5 Flash Free Tier, 1M context)
  - id: gemini-2.5-flash
    provider: gemini
    provider_model: gemini-3.8-flash
    context_length: 1048576
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: free_quota
    latency_estimate_ms: 800
    capabilities: [reasoning, planning, coding, vision, tool_calling, structured_output, long_context, classification, summarization, reflection, json_generation, streaming]
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: true
    supports_tool_calling: true
    quality_score: 0.88
    reliability_score: 0.85
    enabled: true

  # Primary local embedding model (Ollama nomic-embed-text)
  - id: local-nomic-embed
    provider: ollama
    provider_model: nomic-embed-text
    context_length: 8192
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: local
    latency_estimate_ms: 300
    capabilities: [embedding]
    max_concurrency: 2
    supports_streaming: false
    supports_structured_output: false
    supports_reasoning: false
    supports_vision: false
    supports_tool_calling: false
    quality_score: 0.80
    reliability_score: 0.90
    enabled: true

  # Existing 2.5 GB model; an 8K context and one active request suit 8 GiB RAM.
  - id: local-qwen3
    provider: ollama
    provider_model: qwen3:4b
    context_length: 8192
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: local
    latency_estimate_ms: 1500
    capabilities: [reasoning, planning, coding, tool_calling, structured_output, classification, summarization, reflection, json_generation, streaming]
    max_concurrency: 1
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_tool_calling: true
    supports_vision: false
    quality_score: 0.55
    reliability_score: 0.80
    enabled: true

  # Current stable Gemini API model, verified against Google's docs 2026-10-08.
  # Paid prices through 2026-12-31. Free-quota eligibility requires an explicit
  # ATLAS_GEMINI_BILLING_TIER=free declaration for an unbilled Google project.
  - id: gemini-flash
    provider: gemini
    provider_model: gemini-3.8-flash
    context_length: 1048576
    usd_per_1m_input: 0.75
    usd_per_1m_output: 3.75
    cost_class: paid
    latency_estimate_ms: 1000
    capabilities: [reasoning, planning, coding, vision, tool_calling, structured_output, long_context, classification, summarization, reflection, json_generation, streaming]
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: true
    supports_tool_calling: true
    quality_score: 0.80
    reliability_score: 0.80
    enabled: true

  # GLM and MiniMax are paid; free-profile selection must exclude them.
  - id: glm-5.2
    provider: openrouter
    provider_model: z-ai/glm-5.2
    context_length: 1048576
    usd_per_1m_input: 0.152
    usd_per_1m_output: 12.0
    cost_class: paid
    latency_estimate_ms: 800
    capabilities:
      - reasoning
      - planning
      - coding
      - tool_calling
      - structured_output
      - classification
      - summarization
      - reflection
      - json_generation
    max_concurrency: 2
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: false
    supports_tool_calling: true
    quality_score: 0.90
    reliability_score: 0.86
