# The Intelligence Platform Model Registry
# Every model MUST declare cost_class: local | free | free_quota | paid
# The selector uses cost_class to enforce CostPolicy (zero_cost blocks paid).

models:
  # ─── LOCAL MODELS (Ollama) ────────────────────────────────────────────
  # Default development model — always available, $0, no API key needed.
  - id: qwen3-4b
    provider: ollama
    provider_model: qwen3:4b
    context_length: 8192
    usd_per_1m_input: 0.0
    usd_per_1m_output: 0.0
    cost_class: local
    latency_estimate_ms: 100
    capabilities:
      - tool_calling
      - structured_output
      - reflection
      - classification
      - summarization
      - json_generation
      - coding
      - reasoning
      - planning
    max_concurrency: 4
    supports_streaming: true
    supports_structured_output: true
    supports_reasoning: true
    supports_vision: false
    supports_tool_calling: true
    quality_score: 0.60
    reliability_score: 0.95
    enabled: true

  # ─── FREE-QUOTA CLOUD MODELS ─────────────────────────────────────────
  # These are $0 within provider free-tier limits. Disabled by default;
  # enabled when API keys are configured and profile allows cloud.

  - id: gemini-2.0-flash
